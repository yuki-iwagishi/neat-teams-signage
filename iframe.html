<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neat Signage (iframe)</title>
  <style>
    html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}
    iframe{position:fixed;inset:0;width:100vw;height:100vh;border:0;}
  </style>
</head>
<body>
  <!-- ここを、埋め込みたいコンテンツの URL に変更 -->
  <iframe src="https://www.youtube.com/embed/025i7sdv0ug?si=vGOAy45-HDiHbFv6&autoplay=1&mute=1&loop=1&playlist=025i7sdv0ug&controls=0"
          allow="autoplay; fullscreen; encrypted-media"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
</body>
</html>
